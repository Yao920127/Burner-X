name = "academic-search-proxy"
main = "src/index.js"
compatibility_date = "2024-10-01"
workers_dev = true

# Variables (non-sensitive, optional)
[vars]
# 認證設定
ENABLE_AUTH = "false"
ALLOWED_ORIGINS = "http://localhost:8080,https://yourdomain.com"

# 速率限制配置
RATE_LIMIT_ENABLED = "true"        # 是否啟用速率限制
RATE_LIMIT_TPS = "10"              # 每秒請求數限制（總體）
RATE_LIMIT_TPM = "300"             # 每分鐘請求數限制（總體）
RATE_LIMIT_PER_IP_TPS = "5"       # 每個 IP 每秒請求數
RATE_LIMIT_PER_IP_TPM = "100"     # 每個 IP 每分鐘請求數

# 服務級別速率限制（可選）
RATE_LIMIT_PUBMED_TPS = "3"           # PubMed 推薦 3/秒（無 API Key）
RATE_LIMIT_PUBMED_TPM = "180"         # PubMed 每分鐘限制
RATE_LIMIT_SEMANTICSCHOLAR_TPS = "5"  # Semantic Scholar 限制
RATE_LIMIT_SEMANTICSCHOLAR_TPM = "20" # S2 每分鐘 20 次（無 API Key）

# Secrets (set via: wrangler secret put VARIABLE_NAME)
# - SEMANTIC_SCHOLAR_API_KEY (optional, improves rate limits)
# - PUBMED_API_KEY (optional, improves rate limits)
# - AUTH_SECRET (if ENABLE_AUTH = "true")

