
services:
  # PostgreSQL 資料庫
  postgres:
    image: postgres:16-alpine
    container_name: paperburner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-paperburner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-paperburner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paperburner}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Paper Burner X 應用
  app:
    # 方式 1: 從 Docker Hub 拉取（推薦用於生產，快速啟動）
    # image: feather2dev/paper-burner-x:latest
    # pull_policy: always

    # 方式 2: 從本地構建（推薦用於開發和自定義修改）
    # 已切換為本地構建，便於驗證當前倉庫程式碼改動
    build:
      context: .
      dockerfile: Dockerfile

    container_name: paperburner-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 資料庫配置
      DATABASE_URL: postgresql://${DB_USER:-paperburner}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-paperburner}

      # 伺服器配置
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}

      # JWT 配置
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}

      # 加密金鑰（生產必填）
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-your-encryption-secret-min-32-chars-change-in-production}

      # CORS 配置
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      # 部署模式
      DEPLOYMENT_MODE: backend
      RUN_MIGRATIONS: "true"
      # 後端模式下臨時允許內聯腳本（CSP），以相容現有頁面
      CSP_ALLOW_INLINE: "true"

      # OCR API Keys（可選，可透過管理面板配置）
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      DOC2X_API_TOKEN: ${DOC2X_API_TOKEN:-}

      # 翻譯模型 API Keys（可選）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      TONGYI_API_KEY: ${TONGYI_API_KEY:-}
      VOLCANO_API_KEY: ${VOLCANO_API_KEY:-}

    ports:
      # 避免與本機可能佔用的 3000 埠衝突，改為僅綁定 IPv4 127.0.0.1:3300
      - "127.0.0.1:3300:3000"
      # 如需同時綁定 IPv6 本地迴環，可取消下一行註釋（某些環境不支援）：
      # - "[::1]:3300:3000"
    volumes:
      # 如果需要持久化上傳的檔案
      - app_uploads:/app/uploads
      # 將遷移與 schema 掛載到容器，確保舊映象也能找到遷移（只讀）
      - ./server/prisma/migrations:/app/server/prisma/migrations:ro
      - ./server/prisma/schema.prisma:/app/server/prisma/schema.prisma:ro
      # 掛載前端與服務端原始碼為只讀，確保容器執行當前工作區程式碼（避免舊映象殘留）
      - ./server/src:/app/server/src:ro
      - ./index.html:/app/index.html:ro
      - ./login.html:/app/login.html:ro
      - ./admin:/app/admin:ro
      - ./views:/app/views:ro
      - ./js:/app/js:ro
      - ./css:/app/css:ro
      - ./public:/app/public:ro

  # Nginx 反向代理（可選，用於生產環境）
  nginx:
    image: nginx:alpine
    container_name: paperburner-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  app_uploads:
    driver: local

networks:
  default:
    name: paperburner-network
