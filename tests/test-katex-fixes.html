<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KaTeX 錯誤修復測試</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
    <script src="../js/processing/formula_post_processor.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        h1 {
            color: white;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .test-case {
            background: white;
            margin: 20px 0;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .success { color: #27ae60; font-weight: bold; }
        .fail { color: #e74c3c; font-weight: bold; }
        .result {
            border: 3px solid #3498db;
            padding: 20px;
            margin: 15px 0;
            background: #f8f9fa;
            border-radius: 8px;
            min-height: 50px;
            font-size: 18px;
        }
        .source {
            background: #fff3bf;
            border: 2px dashed #fcc419;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        h2 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .badge-before { background: #ffe3e3; color: #c92a2a; }
        .badge-after { background: #d3f9d8; color: #2b8a3e; }
    </style>
</head>
<body>
    <h1>🔧 KaTeX 錯誤自動修復測試</h1>

    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        // 測試用例
        const testCases = [
            {
                name: '使用者問題 1: 行內公式中的 \\tag',
                before: `$i = \\left| {{0.37}{v}_{\\mathrm{r}}}\\right| + \\left| {{0.28}{d}_{\\mathrm{r}}}\\right| + \\left| {{0.2}{o}_{\\mathrm{r}}}\\right| + \\left| {{0.15}{t}_{\\mathrm{r}}}\\right| \\tag{7}$`,
                error: '\\tag 只能在塊級公式中使用',
                fix: '自動移除行內公式中的 \\tag'
            },
            {
                name: '使用者問題 2: \\;^\\circ 語法錯誤',
                before: `$0.1 - 0.2 \\mathrm{\\;^\\circ C}$`,
                error: 'Got group of unknown type: internal',
                fix: '修復為 \\,^{\\circ}\\mathrm{C}'
            },
            {
                name: '額外修復: 雙花括號',
                before: `$\\left| {{0.37}{v}_{\\mathrm{r}}}\\right|$`,
                error: '可能導致內部組錯誤',
                fix: '移除多餘的花括號 {{...}} → {...}'
            },
            {
                name: '塊級公式測試: \\tag 應保留',
                before: `$$i = a + b \\tag{1}$$`,
                error: '無錯誤（塊級公式）',
                fix: '保持不變（\\tag 在塊級公式中有效）'
            },
            {
                name: '溫度符號測試',
                before: `$25\\;^\\circ\\mathrm{C}$`,
                error: '\\;^\\circ 錯誤',
                fix: '修復為 25\\,^{\\circ}\\mathrm{C}'
            }
        ];

        testCases.forEach((test, idx) => {
            const testDiv = document.createElement('div');
            testDiv.className = 'test-case';

            testDiv.innerHTML = `
                <h2>${test.name}</h2>
                <p><strong>原始公式:</strong> <span class="badge badge-before">修復前</span></p>
                <div class="source">${test.before}</div>
                <p><strong>錯誤原因:</strong> ${test.error}</p>
                <p><strong>修復策略:</strong> ${test.fix}</p>
            `;

            // 修復前
            const beforeDiv = document.createElement('div');
            beforeDiv.className = 'result';
            beforeDiv.innerHTML = '<p><strong>修復前渲染:</strong></p>' + test.before;

            testDiv.appendChild(beforeDiv);

            // 應用公式後處理器
            if (typeof FormulaPostProcessor !== 'undefined') {
                FormulaPostProcessor.processFormulasInElement(beforeDiv);
            }

            // 修復後
            const afterDiv = document.createElement('div');
            afterDiv.className = 'result';
            afterDiv.innerHTML = '<p><strong><span class="badge badge-after">修復後</span> 渲染:</strong></p>' + test.before;

            testDiv.appendChild(afterDiv);

            // 應用公式後處理器
            setTimeout(() => {
                if (typeof FormulaPostProcessor !== 'undefined') {
                    FormulaPostProcessor.processFormulasInElement(afterDiv);

                    // 檢查是否有錯誤
                    setTimeout(() => {
                        const hasError = afterDiv.querySelector('.katex-error') !== null;
                        const statusDiv = document.createElement('div');
                        statusDiv.style.marginTop = '15px';
                        statusDiv.innerHTML = hasError
                            ? '<p class="fail">✗ 仍有錯誤</p>'
                            : '<p class="success">✓ 修復成功</p>';
                        testDiv.appendChild(statusDiv);
                    }, 100);
                }
            }, 50);

            output.appendChild(testDiv);
        });

        // 新增說明
        setTimeout(() => {
            const infoDiv = document.createElement('div');
            infoDiv.className = 'test-case';
            infoDiv.innerHTML = `
                <h2>📋 修復規則說明</h2>
                <ol>
                    <li><strong>\\tag 移除規則:</strong> 檢測行內公式（$...$）中的 \\tag{...}，自動移除</li>
                    <li><strong>\\;^\\circ 修復:</strong> 替換為 \\,^{\\circ}（更安全的語法）</li>
                    <li><strong>雙花括號移除:</strong> 遞迴移除 {{...}} → {...}</li>
                    <li><strong>\\mathrm{\\;^\\circ C} 重寫:</strong> 提取到外部 → \\,^{\\circ}\\mathrm{C}</li>
                    <li><strong>上標花括號補全:</strong> ^xy → ^{xy}（多字元上標）</li>
                </ol>

                <h2>✅ 驗證步驟</h2>
                <ol>
                    <li>檢查"修復前"是否顯示錯誤（紅色 katex-error）</li>
                    <li>檢查"修復後"是否正確渲染（無錯誤）</li>
                    <li>在實際應用中重新整理頁面（Ctrl + Shift + R）</li>
                    <li>檢視主控台日誌確認修復規則執行</li>
                </ol>

                <h2>🔍 主控台日誌</h2>
                <p>開啟瀏覽器開發者工具（F12），應該能看到：</p>
                <pre>[FormulaPostProcessor] 移除行內公式中的 \\tag
[FormulaPostProcessor] 修復 \\;^\\circ → \\,^{\\circ}
[FormulaPostProcessor] 修復雙花括號 {{...}} → {...}
[FormulaPostProcessor] 修復 \\mathrm{\\;^\\circ C}</pre>
            `;
            output.appendChild(infoDiv);
        }, 200);
    </script>
</body>
</html>
