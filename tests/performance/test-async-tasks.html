<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驗證：頁面隱藏不影響非同步任務</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .info {
            background: #d1ecf1;
            border-left: 4px solid #17a2b8;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }
        button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 10px 10px 0;
        }
        button:hover {
            background: #0056b3;
        }
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry {
            margin-bottom: 8px;
            padding: 4px 0;
        }
        .log-entry.info { color: #4FC3F7; }
        .log-entry.success { color: #4CAF50; font-weight: bold; }
        .log-entry.error { color: #EF5350; }
        .log-entry.warning { color: #FFA726; }
        .result {
            font-size: 18px;
            font-weight: bold;
            padding: 20px;
            text-align: center;
            border-radius: 4px;
            margin: 20px 0;
        }
        .result.pass {
            background: #d4edda;
            color: #155724;
        }
        .result.fail {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 驗證：頁面隱藏不影響非同步任務</h1>

        <div class="warning">
            <strong>⚠️ 重要說明</strong><br>
            本測試證明：即使頁面隱藏，<strong>fetch()、Promise、async/await</strong> 等非同步任務<strong>仍然正常執行</strong>。
            <br>我們的最佳化隻影響了 <code>setInterval</code> 輪詢，不影響核心業務。
        </div>

        <div class="info">
            <strong>📋 測試步驟</strong><br>
            1. 點選下面的按鈕開始模擬翻譯任務<br>
            2. <strong>立即切換到其他分頁</strong>（這會觸發頁面隱藏）<br>
            3. 等待 3-5 秒後切回來<br>
            4. 檢視結果：任務應該已經完成 ✅
        </div>

        <h2>測試 1: 模擬翻譯 API 呼叫</h2>
        <button onclick="testTranslationAPI()">🔄 開始模擬翻譯（3秒）</button>
        <button onclick="testMultipleAPIs()">🔄 模擬多個並行翻譯（5秒）</button>

        <h2>測試 2: 模擬 AI 對話</h2>
        <button onclick="testAIChatAPI()">💬 開始模擬AI對話（3秒）</button>

        <h2>測試 3: 對比 setInterval（我們最佳化的部分）</h2>
        <button onclick="testSetInterval()">⏱️ 啟動定時器（觀察頁面隱藏時的行為）</button>
        <button onclick="stopSetInterval()">⏹️ 停止定時器</button>

        <div id="result"></div>

        <div class="log" id="log"></div>
    </div>

    <script>
        const logEl = document.getElementById('log');
        const resultEl = document.getElementById('result');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function clearLog() {
            logEl.innerHTML = '';
            resultEl.innerHTML = '';
        }

        // 監聽頁面可見性變化
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                log('🔒 頁面已隱藏（切換到其他分頁）', 'warning');
            } else {
                log('👁️ 頁面可見（切回當前分頁）', 'info');
            }
        });

        // ================================================
        // 測試 1: 模擬翻譯 API
        // ================================================
        async function testTranslationAPI() {
            clearLog();
            log('=== 開始測試：模擬翻譯 API ===', 'info');
            log('⚠️ 請在 3 秒內切換到其他分頁！', 'warning');

            const startTime = Date.now();

            // 模擬翻譯 API 呼叫（3秒延遲）
            try {
                log('📤 傳送翻譯請求...', 'info');

                // 使用真實的 Promise（模擬網路請求）
                const result = await new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({
                            success: true,
                            translatedText: '這是翻譯後的文字',
                            pageHiddenDuringTranslation: false
                        });
                    }, 3000);
                });

                const endTime = Date.now();
                const elapsed = ((endTime - startTime) / 1000).toFixed(1);

                log('✅ 翻譯完成！', 'success');
                log(`⏱️ 耗時: ${elapsed} 秒`, 'info');
                log(`📥 結果: ${result.translatedText}`, 'success');

                // 顯示結果
                resultEl.innerHTML = `
                    <div class="result pass">
                        ✅ 測試透過！<br>
                        即使頁面被隱藏，翻譯任務仍然完成了！<br>
                        <small>耗時: ${elapsed} 秒</small>
                    </div>
                `;

                log('💡 結論：fetch() / Promise 不受頁面隱藏影響', 'success');

            } catch (error) {
                log(`❌ 錯誤: ${error.message}`, 'error');
                resultEl.innerHTML = `
                    <div class="result fail">
                        ❌ 測試失敗！<br>
                        ${error.message}
                    </div>
                `;
            }
        }

        // ================================================
        // 測試 2: 模擬多個並行翻譯
        // ================================================
        async function testMultipleAPIs() {
            clearLog();
            log('=== 開始測試：多個並行翻譯 ===', 'info');
            log('⚠️ 請在 5 秒內切換到其他分頁！', 'warning');

            const startTime = Date.now();

            // 模擬 3 個並行翻譯任務
            const tasks = [
                simulateTranslation('段落 1', 2000),
                simulateTranslation('段落 2', 3000),
                simulateTranslation('段落 3', 4000)
            ];

            try {
                log('📤 傳送 3 個並行翻譯請求...', 'info');

                const results = await Promise.all(tasks);

                const endTime = Date.now();
                const elapsed = ((endTime - startTime) / 1000).toFixed(1);

                log('✅ 所有翻譯完成！', 'success');
                log(`⏱️ 總耗時: ${elapsed} 秒`, 'info');
                results.forEach((result, i) => {
                    log(`📥 結果 ${i + 1}: ${result}`, 'success');
                });

                resultEl.innerHTML = `
                    <div class="result pass">
                        ✅ 測試透過！<br>
                        ${results.length} 個並行翻譯任務都完成了！<br>
                        <small>總耗時: ${elapsed} 秒</small>
                    </div>
                `;

                log('💡 結論：多個非同步任務可以並行執行，不受頁面隱藏影響', 'success');

            } catch (error) {
                log(`❌ 錯誤: ${error.message}`, 'error');
            }
        }

        async function simulateTranslation(text, delay) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    resolve(`${text} (已翻譯)`);
                }, delay);
            });
        }

        // ================================================
        // 測試 3: 模擬 AI 對話
        // ================================================
        async function testAIChatAPI() {
            clearLog();
            log('=== 開始測試：模擬 AI 對話 ===', 'info');
            log('⚠️ 請在 3 秒內切換到其他分頁！', 'warning');

            const startTime = Date.now();

            try {
                log('💬 傳送 AI 對話請求...', 'info');

                // 模擬 AI API 呼叫
                const result = await new Promise((resolve) => {
                    setTimeout(() => {
                        resolve({
                            message: '這是 AI 的回覆內容',
                            tokens: 150
                        });
                    }, 3000);
                });

                const endTime = Date.now();
                const elapsed = ((endTime - startTime) / 1000).toFixed(1);

                log('✅ AI 回覆完成！', 'success');
                log(`⏱️ 耗時: ${elapsed} 秒`, 'info');
                log(`💬 回覆: ${result.message}`, 'success');

                resultEl.innerHTML = `
                    <div class="result pass">
                        ✅ 測試透過！<br>
                        AI 對話在頁面隱藏時仍然正常完成！<br>
                        <small>耗時: ${elapsed} 秒</small>
                    </div>
                `;

                log('💡 結論：AI 對話 API 不受頁面隱藏影響', 'success');

            } catch (error) {
                log(`❌ 錯誤: ${error.message}`, 'error');
            }
        }

        // ================================================
        // 測試 4: setInterval（對比）
        // ================================================
        let intervalId = null;
        let intervalCount = 0;

        function testSetInterval() {
            if (intervalId) {
                log('⚠️ 定時器已在執行', 'warning');
                return;
            }

            clearLog();
            log('=== 開始測試：setInterval 行為（對比） ===', 'info');
            log('🔄 定時器啟動（每秒執行一次）', 'info');
            log('⚠️ 請切換分頁觀察行為', 'warning');

            intervalCount = 0;

            intervalId = setInterval(() => {
                intervalCount++;

                // 檢查頁面是否隱藏
                if (document.hidden) {
                    log(`⏭️ 跳過執行（頁面隱藏，計數: ${intervalCount}）`, 'warning');
                    // 這就是我們在 annotations_summary_modal.js 中做的最佳化
                } else {
                    log(`✓ 正常執行（頁面可見，計數: ${intervalCount}）`, 'success');
                }
            }, 1000);

            log('💡 說明：這就是我們的最佳化邏輯 - 頁面隱藏時跳過執行', 'info');
            log('💡 但 fetch() 等非同步任務不會被跳過！', 'success');
        }

        function stopSetInterval() {
            if (!intervalId) {
                log('⚠️ 定時器未執行', 'warning');
                return;
            }

            clearInterval(intervalId);
            intervalId = null;

            log(`⏹️ 定時器已停止（總計執行 ${intervalCount} 次）`, 'info');
        }

        // ================================================
        // 頁面載入時的提示
        // ================================================
        window.addEventListener('load', () => {
            log('🚀 測試工具已載入', 'info');
            log('💡 提示：測試過程中請切換分頁來驗證非同步任務不受影響', 'info');
        });

        // 頁面解除安裝時清理
        window.addEventListener('beforeunload', () => {
            if (intervalId) {
                clearInterval(intervalId);
            }
        });
    </script>
</body>
</html>
