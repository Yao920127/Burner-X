<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>函式訪問測試</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; overflow: auto; }
    </style>
</head>
<body>
    <h1>函式訪問測試</h1>
    
    <div class="test-section">
        <h2>1. 腳本載入測試</h2>
        <div id="script-load-results"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 函式可用性測試</h2>
        <div id="function-test-results"></div>
    </div>
    
    <div class="test-section">
        <h2>3. 資料載入測試</h2>
        <div id="data-test-results"></div>
    </div>
    
    <div class="test-section">
        <h2>4. 提示詞池測試</h2>
        <button onclick="testPromptPool()">測試提示詞池</button>
        <div id="prompt-pool-results"></div>
    </div>
    
    <!-- 引入必要的腳本 -->
    <script src="js/storage/storage.js"></script>
    <script src="js/process/prompt-pool.js"></script>
    <script src="js/ui/prompt-pool-ui.js"></script>
    
    <script>
        function logResult(sectionId, message, type = 'info') {
            const section = document.getElementById(sectionId);
            const div = document.createElement('div');
            div.className = type;
            div.textContent = message;
            section.appendChild(div);
        }
        
        function logObject(sectionId, title, obj, type = 'info') {
            const section = document.getElementById(sectionId);
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<strong>${title}:</strong><pre>${JSON.stringify(obj, null, 2)}</pre>`;
            section.appendChild(div);
        }
        
        // 測試腳本載入
        function testScriptLoading() {
            logResult('script-load-results', '測試腳本是否正確載入...', 'info');
            
            // 檢查關鍵物件是否存在
            logResult('script-load-results', `window.translationPromptPool: ${typeof window.translationPromptPool}`, 
                typeof window.translationPromptPool !== 'undefined' ? 'success' : 'error');
            logResult('script-load-results', `window.promptPoolUI: ${typeof window.promptPoolUI}`, 
                typeof window.promptPoolUI !== 'undefined' ? 'success' : 'error');
        }
        
        // 測試函式可用性
        function testFunctionAvailability() {
            logResult('function-test-results', '測試關鍵函式是否可用...', 'info');
            
            const functions = [
                'loadAllCustomSourceSites',
                'saveCustomSourceSites', 
                'loadKeys',
                'loadModelKeys'
            ];
            
            functions.forEach(func => {
                const available = typeof window[func] === 'function';
                logResult('function-test-results', `window.${func}: ${typeof window[func]}`, 
                    available ? 'success' : 'error');
            });
            
            // 顯示所有window物件中包含load的函式
            const loadFunctions = Object.keys(window).filter(k => k.includes('load'));
            logObject('function-test-results', '所有包含load的window屬性', loadFunctions, 'info');
        }
        
        // 測試資料載入
        function testDataLoading() {
            logResult('data-test-results', '測試資料載入功能...', 'info');
            
            // 首先新增一些測試資料
            try {
                // 新增測試API金鑰
                localStorage.setItem('deepseekApiKeys', 'test-deepseek-key-1\ntest-deepseek-key-2');
                localStorage.setItem('geminiApiKeys', 'test-gemini-key-1');
                
                // 新增測試源站點配置
                const testSites = {
                    'test_site_1': {
                        displayName: '測試站點1',
                        apiBaseUrl: 'https://api.test1.com',
                        modelId: 'test-model-1',
                        requestFormat: 'openai',
                        temperature: 0.5,
                        friendlyName: '測試站點1'
                    }
                };
                localStorage.setItem('custom_source_sites', JSON.stringify(testSites));
                
                logResult('data-test-results', '測試資料已新增到localStorage', 'success');
                
                // 測試函式呼叫
                if (typeof window.loadAllCustomSourceSites === 'function') {
                    const sites = window.loadAllCustomSourceSites();
                    logObject('data-test-results', '載入的源站點', sites, 'success');
                } else {
                    logResult('data-test-results', 'loadAllCustomSourceSites函式不可用', 'error');
                }
                
                if (typeof window.loadKeys === 'function') {
                    const deepseekKeys = window.loadKeys('deepseek');
                    logObject('data-test-results', 'DeepSeek金鑰', deepseekKeys, 'success');
                } else {
                    logResult('data-test-results', 'loadKeys函式不可用', 'error');
                }
                
            } catch (error) {
                logResult('data-test-results', `資料測試出錯: ${error.message}`, 'error');
            }
        }
        
        // 測試提示詞池
        function testPromptPool() {
            logResult('prompt-pool-results', '測試提示詞池功能...', 'info');
            
            try {
                if (window.promptPoolUI) {
                    // 觸發模型列表填充
                    window.promptPoolUI.populateAvailableModels();
                    logResult('prompt-pool-results', '已觸發模型列表填充', 'success');
                    
                    // 檢查模型選擇框
                    const modelSelect = document.getElementById('generationModel');
                    if (modelSelect) {
                        logResult('prompt-pool-results', `模型選擇框選項數量: ${modelSelect.options.length}`, 'info');
                        for (let i = 0; i < modelSelect.options.length; i++) {
                            logResult('prompt-pool-results', `選項${i}: ${modelSelect.options[i].value} - ${modelSelect.options[i].text}`, 'info');
                        }
                    } else {
                        logResult('prompt-pool-results', '未找到模型選擇框', 'error');
                    }
                } else {
                    logResult('prompt-pool-results', 'window.promptPoolUI不存在', 'error');
                }
            } catch (error) {
                logResult('prompt-pool-results', `提示詞池測試出錯: ${error.message}`, 'error');
            }
        }
        
        // 頁面載入完成後執行測試
        document.addEventListener('DOMContentLoaded', () => {
            console.log('開始測試...');
            
            // 立即測試
            testScriptLoading();
            testFunctionAvailability();
            testDataLoading();
            
            // 延遲測試（等待腳本完全載入）
            setTimeout(() => {
                console.log('延遲測試開始...');
                logResult('function-test-results', '--- 延遲測試結果 ---', 'info');
                testFunctionAvailability();
            }, 2000);
            
            setTimeout(() => {
                console.log('最終測試開始...');
                logResult('function-test-results', '--- 最終測試結果 ---', 'info');
                testFunctionAvailability();
            }, 4000);
        });
    </script>
</body>
</html>
