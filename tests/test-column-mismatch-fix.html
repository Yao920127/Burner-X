<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>表格列數不比對修復測試</title>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <script src="../js/processing/markdown_processor_ast.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 1600px;
            margin: 20px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        h1 {
            color: white;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .test-case {
            background: white;
            margin: 20px 0;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .success { color: #27ae60; font-weight: bold; }
        .fail { color: #e74c3c; font-weight: bold; }
        .log {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        .result {
            border: 3px solid #3498db;
            padding: 20px;
            margin: 15px 0;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .result table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            background: white;
        }
        .result th, .result td {
            border: 1px solid #dee2e6;
            padding: 10px;
            text-align: left;
        }
        .result th {
            background: linear-gradient(135deg, #4c6ef5, #364fc7);
            color: white;
            font-weight: bold;
        }
        .result tr:nth-child(even) {
            background: #f8f9fa;
        }
        .source {
            background: #fff3bf;
            border: 2px dashed #fcc419;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            white-space: pre-wrap;
        }
        h2 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🔧 表格列數不比對修復測試</h1>

    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        const logs = [];

        // 攔截console.log
        const originalLog = console.log;
        console.log = function(...args) {
            logs.push(args.join(' '));
            originalLog.apply(console, args);
        };

        // 測試用例
        const testCases = [
            {
                name: 'Block #31 (表頭6列，分隔符7列)',
                markdown: `| | | | 五分位數 (Quintiles) | | |
|---|---|---|---|---|---|---|
| | 1 | 2 | 3 | 4 | 5 | 5-1 |
| 市場 (Market) | 0.145*** | 0.200** | 0.061* | 0.136* | 0.106*** | -0.039 |`
            },
            {
                name: '簡單測試 (表頭3列，分隔符4列)',
                markdown: `| A | B | C |
|---|---|---|---|
| 1 | 2 | 3 |
| 4 | 5 | 6 |`
            },
            {
                name: '表頭多列 (表頭5列，分隔符3列)',
                markdown: `| A | B | C | D | E |
|---|---|---|
| 1 | 2 | 3 | 4 | 5 |`
            }
        ];

        testCases.forEach((test, idx) => {
            logs.length = 0; // 清空日誌

            const testDiv = document.createElement('div');
            testDiv.className = 'test-case';

            testDiv.innerHTML = `<h2>${test.name}</h2>`;

            // 顯示原始 Markdown
            testDiv.innerHTML += `
                <h3>原始 Markdown:</h3>
                <div class="source">${test.markdown}</div>
            `;

            // 分析列數
            const lines = test.markdown.split('\n');
            const headerPipes = (lines[0].match(/\|/g) || []).length;
            const separatorPipes = (lines[1].match(/\|/g) || []).length;

            testDiv.innerHTML += `
                <p>表頭管道符: <strong>${headerPipes}</strong> (${headerPipes - 1} 列)</p>
                <p>分隔符管道符: <strong>${separatorPipes}</strong> (${separatorPipes - 1} 列)</p>
                ${headerPipes !== separatorPipes ? '<p class="fail">⚠️ 列數不比對！</p>' : '<p class="success">✓ 列數比對</p>'}
            `;

            // 使用 MarkdownProcessorAST 渲染
            if (typeof MarkdownProcessorAST !== 'undefined' && MarkdownProcessorAST.render) {
                const rendered = MarkdownProcessorAST.render(test.markdown, {});
                const isTable = rendered.trim().startsWith('<table');

                testDiv.innerHTML += `
                    <h3>渲染結果:</h3>
                    <p>${isTable ? '<span class="success">✓ 成功渲染為 &lt;table&gt;</span>' : '<span class="fail">✗ 渲染為 &lt;p&gt;</span>'}</p>
                    <div class="result">${rendered}</div>
                `;

                if (logs.length > 0) {
                    testDiv.innerHTML += `
                        <h3>修復日誌:</h3>
                        <div class="log">${logs.join('\n')}</div>
                    `;
                }
            } else {
                testDiv.innerHTML += '<p class="fail">✗ MarkdownProcessorAST 未載入</p>';
            }

            output.appendChild(testDiv);
        });

        // 新增說明
        setTimeout(() => {
            const infoDiv = document.createElement('div');
            infoDiv.className = 'test-case';
            infoDiv.innerHTML = `
                <h2>📋 測試說明</h2>
                <p><strong>修復策略：</strong></p>
                <ul>
                    <li><strong>表頭列數 < 分隔符列數：</strong>刪除分隔符的多餘列</li>
                    <li><strong>表頭列數 > 分隔符列數：</strong>給分隔符新增 <code>---|</code></li>
                    <li><strong>資料行列數 < 分隔符列數：</strong>給資料行新增空單元格 <code> |</code></li>
                </ul>

                <h2>✅ 驗證步驟</h2>
                <ol>
                    <li>所有測試用例應顯示為 <code>&lt;table&gt;</code> 而非 <code>&lt;p&gt;</code></li>
                    <li>修復日誌應顯示列數調整資訊</li>
                    <li>表格應正確顯示邊框和樣式</li>
                </ol>

                <h2>🚀 下一步</h2>
                <p>如果此測試透過，請重新整理實際應用 (Ctrl + Shift + R) 來驗證 Block #31 的渲染。</p>
            `;
            output.appendChild(infoDiv);
        }, 100);
    </script>
</body>
</html>
