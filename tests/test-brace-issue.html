<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>花括號公式測試</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="js/processing/markdown_processor_ast.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-case {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .test-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .source {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #4CAF50;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .result {
            background: #fff;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #2196F3;
        }
        .expected {
            background: #e8f5e9;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #4CAF50;
        }
        .debug {
            background: #fff3e0;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>花括號公式渲染測試</h1>

    <div class="test-case">
        <div class="test-title">問題：包含轉義花括號的公式</div>
        <div class="source" id="source1"></div>
        <div class="result" id="result1"></div>
        <div class="debug" id="debug1"></div>
    </div>

    <div class="test-case">
        <div class="test-title">單獨測試：單個公式</div>
        <div class="source" id="source2"></div>
        <div class="result" id="result2"></div>
    </div>

    <div class="test-case">
        <div class="test-title">單獨測試：三個公式</div>
        <div class="source" id="source3"></div>
        <div class="result" id="result3"></div>
    </div>

    <script>
        // 開啟除錯模式
        if (typeof MarkdownProcessorAST !== 'undefined') {
            MarkdownProcessorAST.setDebug(true);
        }

        const testCases = [
            {
                title: '完整段落',
                input: '其中 $p \\in \\{0,1, \\cdots, d-1\\}$，$o \\in \\{0,1\\}$，$r \\in \\mathbb{Z}$。為了測量 $|\\psi_{r}\\rangle$，我們定義測量算符為'
            },
            {
                title: '單個公式',
                input: '$p \\in \\{0,1, \\cdots, d-1\\}$'
            },
            {
                title: '三個公式',
                input: '$p \\in \\{0,1, \\cdots, d-1\\}$，$o \\in \\{0,1\\}$，$r \\in \\mathbb{Z}$'
            }
        ];

        console.clear();
        console.log('=== 開始測試 ===');

        testCases.forEach((testCase, index) => {
            const sourceEl = document.getElementById(`source${index + 1}`);
            const resultEl = document.getElementById(`result${index + 1}`);
            const debugEl = document.getElementById(`debug${index + 1}`);

            sourceEl.textContent = testCase.input;

            console.log(`\n--- 測試 ${index + 1}: ${testCase.title} ---`);
            console.log('輸入:', testCase.input);

            try {
                const rendered = MarkdownProcessorAST.render(testCase.input);
                resultEl.innerHTML = rendered;

                console.log('渲染成功');
                if (debugEl) {
                    debugEl.textContent = `輸出 HTML (前 500 字元):\n${rendered.substring(0, 500)}`;
                }
            } catch (error) {
                console.error('渲染錯誤:', error);
                resultEl.innerHTML = `<span style="color: red;">錯誤: ${error.message}</span>`;
                if (debugEl) {
                    debugEl.textContent = `錯誤: ${error.message}\n${error.stack}`;
                }
            }
        });

        console.log('\n=== 測試完成 ===');
        console.log('Metrics:', MarkdownProcessorAST.getMetrics());
    </script>
</body>
</html>
