<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>公式渲染問題測試</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="js/processing/markdown_processor_ast.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }
        .test-case {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .test-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .source {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #4CAF50;
            font-family: monospace;
        }
        .result {
            background: #fff;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #2196F3;
        }
        .katex-fallback {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <h1>公式渲染問題測試</h1>

    <div class="test-case">
        <div class="test-title">問題1: 簡單單位公式</div>
        <div class="source" id="source1"></div>
        <div class="result" id="result1"></div>
    </div>

    <div class="test-case">
        <div class="test-title">問題2: 段落中的多個公式</div>
        <div class="source" id="source2"></div>
        <div class="result" id="result2"></div>
    </div>

    <div class="test-case">
        <div class="test-title">測試3: 其他類似公式</div>
        <div class="source" id="source3"></div>
        <div class="result" id="result3"></div>
    </div>

    <script>
        const testCases = [
            {
                title: '問題1',
                input: '$1\\mathrm{\\;m}/\\mathrm{s}$'
            },
            {
                title: '問題2',
                input: '(a) 在 ${10}\\mathrm{\\;{min}}$ 時，${\\mathrm{{CO}}}_{2}$ 在 ${1.5}\\mathrm{\\;m}$ 處 和 1.1 $\\mathrm{m}$ 處，對於 $8\\mathrm{{person}}/{\\mathrm{m}}^{2}$ 的模擬，我們仍使用了 $4\\mathrm{{person}}/{\\mathrm{m}}^{2}$ 的模型'
            },
            {
                title: '測試3',
                input: '速度為 $1\\mathrm{m}/\\mathrm{s}$，質量為 $2\\mathrm{kg}$'
            }
        ];

        testCases.forEach((testCase, index) => {
            const sourceEl = document.getElementById(`source${index + 1}`);
            const resultEl = document.getElementById(`result${index + 1}`);

            sourceEl.textContent = testCase.input;

            try {
                const rendered = MarkdownProcessorAST.render(testCase.input);
                resultEl.innerHTML = rendered;
            } catch (error) {
                resultEl.innerHTML = `<span style="color: red;">錯誤: ${error.message}</span>`;
            }
        });

        // 顯示診斷資訊
        console.log('MarkdownProcessorAST Metrics:', MarkdownProcessorAST.getMetrics());
    </script>
</body>
</html>
