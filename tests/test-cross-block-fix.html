<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨子塊醒目提示修復測試</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .test-container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .test-block { margin: 10px 0; padding: 10px; background: #f9f9f9; border-left: 4px solid #007cba; }
        .sub-block { display: inline; margin: 0 2px; }
        .status { padding: 5px 10px; margin: 5px 0; border-radius: 3px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .status.info { background: #d1ecf1; color: #0c5460; }
        button { margin: 5px; padding: 8px 15px; background: #007cba; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #005a87; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>跨子塊醒目提示修復測試</h1>
        
        <div id="test-results"></div>
        
        <!-- 測試跨子塊醒目提示 -->
        <div class="test-section">
            <h2>跨子塊醒目提示測試</h2>
            <div class="test-block" data-block-index="4">
                <span class="sub-block" data-sub-block-id="4.0">這是第一個子塊的內容。</span>
                <span class="sub-block" data-sub-block-id="4.1">這是第二個子塊的內容。</span>
                <span class="sub-block" data-sub-block-id="4.2">這是第三個子塊的內容。</span>
            </div>
            <button onclick="testCrossBlockHighlight()">測試跨子塊醒目提示應用</button>
            <button onclick="testCrossBlockWithOffsets()">測試帶偏移的跨子塊醒目提示</button>
            <button onclick="clearHighlights()">清除醒目提示</button>
        </div>
        
        <div id="console-output" style="background: #f0f0f0; padding: 10px; margin-top: 20px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto;">
            <h3>主控台輸出</h3>
        </div>
    </div>

    <!-- 引入必要腳本 -->
    <script src="js/annotations/annotation_highlighter.js"></script>
    <script src="js/annotations/annotation_logic.js"></script>

    <script>
        // 模擬全域環境
        window.data = { annotations: [] };
        window.globalCurrentContentIdentifier = 'ocr';
        window.contentReady = true;
        
        // 重定向console輸出到頁面
        const consoleOutput = document.getElementById('console-output');
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        function logToPage(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.innerHTML = `<span style="color: #666;">[${timestamp}]</span> <span style="color: ${type === 'error' ? 'red' : type === 'warn' ? 'orange' : 'black'};">${message}</span>`;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(message) {
            originalLog.apply(console, arguments);
            logToPage(message);
        };
        console.warn = function(message) {
            originalWarn.apply(console, arguments);
            logToPage(message, 'warn');
        };
        console.error = function(message) {
            originalError.apply(console, arguments);
            logToPage(message, 'error');
        };

        function showStatus(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            resultsDiv.appendChild(statusDiv);
        }

        function testCrossBlockHighlight() {
            console.log('開始測試跨子塊醒目提示...');
            showStatus('開始測試跨子塊醒目提示', 'info');
            
            try {
                // 建立模擬的跨子塊批註
                const mockCrossBlockAnnotation = {
                    "@context": "http://www.w3.org/ns/anno.jsonld",
                    "id": "urn:uuid:test-cross-block-annotation",
                    "type": "Annotation",
                    "motivation": "highlighting",
                    "isCrossBlock": true,  // 關鍵標識
                    "targetType": "ocr",
                    "highlightColor": "yellow",
                    "target": {
                        "selector": [{
                            "type": "CrossBlockRangeSelector",
                            "startSubBlockId": "4.0",
                            "endSubBlockId": "4.2", 
                            "affectedSubBlocks": ["4.0", "4.1", "4.2"],
                            "exact": "這是第一個子塊的內容。這是第二個子塊的內容。這是第三個子塊的內容。"
                        }]
                    },
                    "body": []
                };

                console.log('建立的跨子塊批註:', mockCrossBlockAnnotation);
                
                // 獲取容器元素
                const container = document.querySelector('.test-container');
                const allAnnotations = [mockCrossBlockAnnotation];
                
                console.log('呼叫 applyBlockAnnotations...');
                
                // 呼叫醒目提示應用函式
                if (typeof window.applyBlockAnnotations === 'function') {
                    window.applyBlockAnnotations(container, allAnnotations, 'ocr');
                    showStatus('✅ applyBlockAnnotations 呼叫成功', 'success');
                } else {
                    showStatus('❌ applyBlockAnnotations 函式未找到', 'error');
                }
                
                // 檢查是否成功應用了醒目提示
                setTimeout(() => {
                    const highlightedElements = container.querySelectorAll('.cross-block-highlight, [data-annotation-id]');
                    console.log(`找到 ${highlightedElements.length} 個醒目提示元素`);
                    
                    if (highlightedElements.length > 0) {
                        showStatus(`✅ 成功應用醒目提示到 ${highlightedElements.length} 個元素`, 'success');
                        highlightedElements.forEach((el, index) => {
                            console.log(`醒目提示元素 ${index + 1}:`, el.outerHTML.substring(0, 100) + '...');
                        });
                    } else {
                        showStatus('❌ 未發現醒目提示元素', 'error');
                    }
                }, 100);
                
            } catch (error) {
                console.error('跨子塊醒目提示測試失敗:', error);
                showStatus(`❌ 測試失敗: ${error.message}`, 'error');
            }
        }

        function testCrossBlockWithOffsets() {
            console.log('開始測試帶偏移的跨子塊醒目提示...');
            showStatus('開始測試帶偏移的跨子塊醒目提示', 'info');

            try {
                const mockCrossBlockAnnotation = {
                    "@context": "http://www.w3.org/ns/anno.jsonld",
                    "id": "urn:uuid:test-cross-block-annotation-offsets",
                    "type": "Annotation",
                    "motivation": "highlighting",
                    "isCrossBlock": true,
                    "targetType": "ocr",
                    "highlightColor": "yellow",
                    "target": {
                        "selector": [{
                            "type": "CrossBlockRangeSelector",
                            "startSubBlockId": "4.0",
                            "endSubBlockId": "4.2",
                            // 選中：從第一個子塊的第3個字元開始，到最後一個子塊倒數第4個字元結束
                            "startOffset": 2,
                            "endOffset":  (function(){
                                const endEl = document.querySelector('[data-sub-block-id=\"4.2\"]');
                                return Math.max(0, (endEl && endEl.textContent ? endEl.textContent.length - 3 : 0));
                            })(),
                            "affectedSubBlocks": ["4.0", "4.1", "4.2"],
                            "exact": "(測試偏移)"
                        }]
                    },
                    "body": []
                };

                const container = document.querySelector('.test-container');
                const allAnnotations = [mockCrossBlockAnnotation];

                if (typeof window.applyBlockAnnotations === 'function') {
                    window.applyBlockAnnotations(container, allAnnotations, 'ocr');
                    showStatus('✅ 帶偏移的 applyBlockAnnotations 呼叫成功', 'success');
                } else {
                    showStatus('❌ applyBlockAnnotations 函式未找到', 'error');
                }
            } catch (error) {
                console.error('帶偏移的跨子塊醒目提示測試失敗:', error);
                showStatus(`❌ 測試失敗: ${error.message}`, 'error');
            }
        }

        function clearHighlights() {
            console.log('清除所有醒目提示...');
            const container = document.querySelector('.test-container');
            
            // 呼叫清除醒目提示
            if (typeof window.applyBlockAnnotations === 'function') {
                window.applyBlockAnnotations(container, [], 'ocr');
                showStatus('✅ 醒目提示已清除', 'info');
            }
        }

        // 頁面載入完成後初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('跨子塊醒目提示修復測試頁面載入完成');
            
            // 檢查關鍵函式是否載入
            console.log('檢查函式載入狀態:');
            console.log('- applyBlockAnnotations:', typeof window.applyBlockAnnotations);
            console.log('- applyCrossBlockAnnotation:', typeof window.applyCrossBlockAnnotation);
            console.log('- detectFormulaType:', typeof window.detectFormulaType);
            
            if (typeof window.applyBlockAnnotations === 'function') {
                showStatus('✅ applyBlockAnnotations 函式載入成功', 'success');
            } else {
                showStatus('❌ applyBlockAnnotations 函式載入失敗', 'error');
            }
            
            showStatus('測試環境初始化完成，可以開始測試。', 'success');
        });
    </script>
</body>
</html>
