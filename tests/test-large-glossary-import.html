<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大資料術語庫匯入測試</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">大資料術語庫匯入效能測試</h1>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">快速生成測試資料</h2>
            <div class="flex gap-4 items-center mb-4">
                <label class="text-sm text-gray-600">條目數量:</label>
                <input type="number" id="generateCount" value="70000" min="1000" max="1000000"
                       class="border rounded px-3 py-2 w-40">
                <button onclick="generateTestData()" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                    生成測試資料
                </button>
            </div>
            <div id="generateStatus" class="text-sm text-gray-600"></div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">匯入測試</h2>
            <button onclick="testImport()" class="bg-green-500 text-white px-6 py-2 rounded hover:bg-green-600 mb-4">
                開始匯入測試
            </button>

            <!-- 進度條 -->
            <div class="mb-4">
                <div class="flex justify-between text-sm text-gray-600 mb-2">
                    <span id="progressText">等待開始...</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4">
                    <div id="progressBar" class="bg-blue-500 h-4 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>

            <div id="importStatus" class="text-sm space-y-1"></div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold mb-4">效能統計</h2>
            <div id="stats" class="grid grid-cols-2 gap-4 text-sm"></div>
        </div>
    </div>

    <script src="/js/storage/storage.js"></script>
    <script src="/js/storage/glossary-storage.js"></script>

    <script>
        let testData = null;

        function log(elementId, message, append = true) {
            const el = document.getElementById(elementId);
            if (append) {
                const line = document.createElement('div');
                line.textContent = message;
                el.appendChild(line);
                el.scrollTop = el.scrollHeight;
            } else {
                el.textContent = message;
            }
        }

        function updateProgress(current, total, message) {
            const percent = Math.round((current / total) * 100);
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressText').textContent = message;
        }

        function generateTestData() {
            const count = parseInt(document.getElementById('generateCount').value);
            const statusEl = document.getElementById('generateStatus');

            statusEl.textContent = `正在生成 ${count.toLocaleString()} 條測試資料...`;

            setTimeout(() => {
                const startTime = performance.now();

                const entries = [];
                for (let i = 1; i <= count; i++) {
                    entries.push({
                        id: `test-${i}`,
                        term: `Term-${i}`,
                        translation: `翻譯詞條 ${i} - 這裡是一些額外的文字內容用於增加資料量`,
                        caseSensitive: i % 10 === 0,
                        wholeWord: i % 5 === 0,
                        enabled: true
                    });
                }

                testData = {
                    id: 'test-large-set',
                    name: `大型測試術語庫 (${count.toLocaleString()} 條)`,
                    enabled: true,
                    entries: entries
                };

                const elapsed = performance.now() - startTime;
                const sizeKB = (JSON.stringify(testData).length / 1024).toFixed(2);

                statusEl.innerHTML = `
                    ✅ 已生成 ${count.toLocaleString()} 條測試資料<br>
                    耗時: ${elapsed.toFixed(0)} ms<br>
                    資料大小: ${sizeKB} KB (${(sizeKB / 1024).toFixed(2)} MB)
                `;

                log('stats', '', false);
                document.getElementById('stats').innerHTML = `
                    <div><strong>條目數量:</strong> ${count.toLocaleString()}</div>
                    <div><strong>資料大小:</strong> ${sizeKB} KB</div>
                    <div><strong>生成耗時:</strong> ${elapsed.toFixed(0)} ms</div>
                    <div><strong>平均:</strong> ${(elapsed / count).toFixed(3)} ms/條</div>
                `;
            }, 100);
        }

        async function testImport() {
            if (!testData) {
                alert('請先生成測試資料！');
                return;
            }

            if (!window.glossaryStorage) {
                alert('glossary-storage.js 未載入');
                return;
            }

            const importStatusEl = document.getElementById('importStatus');
            importStatusEl.innerHTML = '';

            log('importStatus', '開始匯入測試...', true);
            updateProgress(0, testData.entries.length, '準備匯入...');

            const startTime = performance.now();
            let lastUpdateTime = startTime;
            let lastProcessed = 0;

            try {
                // 使用帶進度回撥的儲存函式
                await window.glossaryStorage.saveGlossarySetUnified(
                    {
                        id: testData.id,
                        name: testData.name,
                        enabled: testData.enabled
                    },
                    testData.entries,
                    (current, total) => {
                        const now = performance.now();
                        const elapsed = now - startTime;
                        const chunkElapsed = now - lastUpdateTime;
                        const processed = current - lastProcessed;
                        const speed = processed / (chunkElapsed / 1000);

                        updateProgress(
                            current,
                            total,
                            `已儲存: ${current.toLocaleString()} / ${total.toLocaleString()} (${speed.toFixed(0)} 條/秒)`
                        );

                        lastUpdateTime = now;
                        lastProcessed = current;
                    }
                );

                const totalElapsed = performance.now() - startTime;
                const avgSpeed = testData.entries.length / (totalElapsed / 1000);

                log('importStatus', `✅ 匯入完成！`, true);
                log('importStatus', `總耗時: ${(totalElapsed / 1000).toFixed(2)} 秒`, true);
                log('importStatus', `平均速度: ${avgSpeed.toFixed(0)} 條/秒`, true);
                log('importStatus', `平均: ${(totalElapsed / testData.entries.length).toFixed(3)} ms/條`, true);

                // 更新統計
                const statsEl = document.getElementById('stats');
                statsEl.innerHTML += `
                    <div><strong>匯入耗時:</strong> ${(totalElapsed / 1000).toFixed(2)} 秒</div>
                    <div><strong>平均速度:</strong> ${avgSpeed.toFixed(0)} 條/秒</div>
                    <div><strong>儲存成功:</strong> ✅</div>
                    <div><strong>儲存方式:</strong> IndexedDB (分塊)</div>
                `;

                updateProgress(testData.entries.length, testData.entries.length, '匯入完成！');

                // 驗證資料
                log('importStatus', '驗證資料...', true);
                const loaded = await window.glossaryStorage.loadEntriesForSetUnified(testData.id);
                log('importStatus', `驗證完成: 讀取到 ${loaded.length.toLocaleString()} 條`, true);

            } catch (err) {
                log('importStatus', `❌ 匯入失敗: ${err.message}`, true);
                console.error('Import error:', err);
            }
        }

        // 頁面載入時等待初始化
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (window.glossaryStorage) {
                    log('generateStatus', '✅ 術語庫儲存模組已就緒', false);
                } else {
                    log('generateStatus', '❌ 術語庫儲存模組未載入', false);
                }
            }, 1000);
        });
    </script>
</body>
</html>
