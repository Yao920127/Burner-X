<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - Paper Burner X</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://gcore.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <script>
    // 防止登入頁 redirect 引數遞迴疊加/迴圈
    (function () {
      try {
        var url = new URL(window.location.href);
        var red = url.searchParams.get('redirect');
        if (!red) return;
        // 多層解碼，防止 %25 級聯編碼導致的巢狀繞過
        function deepDecode(s, limit) {
          var i = 0, prev = s;
          while (i++ < (limit || 8)) {
            try {
              var next = decodeURIComponent(prev);
              if (next === prev) break;
              prev = next;
            } catch { break; }
          }
          return prev;
        }
        var decoded = deepDecode(red, 8);
        // 規則：
        // 1) 任意層包含 login.html?redirect= 視為遞迴 → 歸一 '/'
        // 2) 過長（>512）視為異常 → 歸一 '/'
        var shouldClamp = (red.length > 512) || (decoded.length > 512) || (decoded.indexOf('/login.html?redirect=') !== -1);
        if (shouldClamp) {
          url.searchParams.set('redirect', '/');
          history.replaceState(null, '', url.toString());
          return;
        }
        // 僅允許同源，且目標不能是登入頁自身
        var target;
        try { target = new URL(decoded, window.location.origin); } catch { target = null; }
        if (!target || target.origin !== window.location.origin || target.pathname.endsWith('/login.html')) {
          url.searchParams.set('redirect', '/');
          history.replaceState(null, '', url.toString());
        }
      } catch {}
    })();
  </script>
  <div class="bg-white p-8 rounded-lg shadow w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-center">登入到 Paper Burner X</h1>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">郵箱</label>
        <input id="email" type="email" required class="mt-1 block w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">密碼</label>
        <input id="password" type="password" required class="mt-1 block w-full px-3 py-2 border rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500" placeholder="••••••••" />
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">登入</button>
      <p id="error" class="text-red-600 text-sm hidden"></p>
    </form>
    <div class="text-sm text-gray-500 mt-4">
      <p>預設管理員：<code>admin@paperburner.local / admin123456</code></p>
      <p class="mt-1">管理員入口：<a href="/admin" class="text-blue-600 hover:underline">/admin</a></p>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin + '/api';

    function getSafeRedirect() {
      try {
        const p = new URLSearchParams(window.location.search);
        const raw = p.get('redirect');
        if (!raw) return '/';
        // 多層解碼，長度限制
        function deepDecode(s, limit) {
          let i = 0, prev = s;
          while (i++ < (limit || 8)) {
            try {
              const next = decodeURIComponent(prev);
              if (next === prev) break;
              prev = next;
            } catch { break; }
          }
          return prev;
        }
        const decoded = deepDecode(raw, 8);
        if (decoded.length > 512 || decoded.indexOf('/login.html?redirect=') !== -1) return '/';
        const u = new URL(decoded, window.location.origin);
        // 僅允許同源回跳，且不指向 login.html 防止迴圈
        if (u.origin !== window.location.origin) return '/';
        if (u.pathname.endsWith('/login.html')) return '/';
        u.searchParams.delete('redirect');
        return u.toString();
      } catch { return '/'; }
    }

    function getRedirect() {
      try {
        const p = new URLSearchParams(window.location.search);
        return p.get('redirect') || '/';
      } catch { return '/'; }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('error');
      err.classList.add('hidden');
      err.textContent = '';
      try {
        const res = await axios.post(`${API_BASE}/auth/login`, { email, password });
        if (res.data && res.data.token) {
          // 與前端介面卡一致的儲存鍵
          localStorage.setItem('auth_token', res.data.token);
          window.location.href = getSafeRedirect();
        } else {
          throw new Error('登入響應異常');
        }
      } catch (e2) {
        err.textContent = e2?.response?.data?.error || e2.message || '登入失敗';
        err.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
